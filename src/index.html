<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>py_trees Live Execution Visualizer</title>
    <!-- Cytoscape Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- Dagre Layout Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #header {
            padding: 12px 20px;
            background-color: #252526;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #status-indicator {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background-color: #555;
        }

        #cy {
            width: 100vw;
            height: calc(100vh - 55px);
            display: block;
        }

        .connected { background-color: #2e7d32 !important; }
        .disconnected { background-color: #c62828 !important; }
    </style>
</head>
<body>

    <div id="header">
        <h2 style="margin: 0; font-size: 18px;">py_trees Live Monitor</h2>
        <span id="status-indicator" class="disconnected">DISCONNECTED</span>
    </div>

    <div id="cy"></div>

    <script>
        // 1. Explicitly register dagre extension with Cytoscape
        if (typeof cytoscapeDagre !== 'undefined') {
            cytoscape.use(cytoscapeDagre);
        }

        let cy = null;

        function initCytoscape() {
            cy = cytoscape({
                container: document.getElementById('cy'),
                style: [
                    {
                        selector: 'node',
                        style: {
                                'label': 'data(label)',
                                'color': '#ffffff',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'font-size': '11px',
                                'text-wrap': 'wrap',                  // Enable multi-line text wrapping
                                'text-max-width': '140px',             // Wrap text if it exceeds this width
                                'text-line-height': '1.3',             // Line spacing between name and type
                                'background-color': '#424242',
                                'border-width': 3,
                                'border-color': '#616161',
                                'shape': 'round-rectangle',
                                'width': 'label',                      // Auto-fit node width around text
                                'height': 'label',                     // Auto-fit node height around text
                                'padding': '12px',
                                'transition-property': 'background-color, border-color, shadow-blur',
                                'transition-duration': '0.2s'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#555',
                            'target-arrow-color': '#555',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier'
                        }
                    },
                    {
                        selector: 'node[status = "RUNNING"]',
                        style: {
                            'background-color': '#f57f17',
                            'border-color': '#ffeb3b',
                            'color': '#000000',
                            'shadow-blur': 15,
                            'shadow-color': '#ffeb3b',
                            'shadow-opacity': 0.8
                        }
                    },
                    {
                        selector: 'node[status = "SUCCESS"]',
                        style: {
                            'background-color': '#2e7d32',
                            'border-color': '#4caf50',
                            'color': '#ffffff'
                        }
                    },
                    {
                        selector: 'node[status = "FAILURE"]',
                        style: {
                            'background-color': '#c62828',
                            'border-color': '#ef5350',
                            'color': '#ffffff'
                        }
                    },
                    {
                        selector: 'node[status = "INVALID"]',
                        style: {
                            'background-color': '#333333',
                            'border-color': '#555555',
                            'color': '#888888'
                        }
                    }
                ]
            });
        }

        // Extracts elements without creating duplicates
        function parseTreeToElements(node, elements = [], parentId = null) {
            const nodeId = node.id;
            const label = `${node.name}\n[${node.type}]`;

            elements.push({
                data: { id: nodeId, label: label, status: node.status }
            });

            if (parentId) {
                // Ensure unique edge IDs to prevent duplication
                elements.push({
                    data: { id: `${parentId}->${nodeId}`, source: parentId, target: nodeId }
                });
            }

            if (node.children) {
                node.children.forEach(child => parseTreeToElements(child, elements, nodeId));
            }

            return elements;
        }

        // Safely updates status attributes without modifying topology
        function updateNodeStatuses(node) {
            const cyNode = cy.getElementById(node.id);
            if (cyNode) {
                cyNode.data('status', node.status);
            }
            if (node.children) {
                node.children.forEach(child => updateNodeStatuses(child));
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initCytoscape();

            const socket = io('http://localhost:5500');
            const indicator = document.getElementById('status-indicator');

            socket.on('connect', () => {
                indicator.textContent = 'LIVE CONNECTED';
                indicator.className = 'connected';
            });

            socket.on('disconnect', () => {
                indicator.textContent = 'DISCONNECTED';
                indicator.className = 'disconnected';
            });

            socket.on('tree_update', (data) => {
                // Check if graph topology already exists in Cytoscape
                if (cy.nodes().length === 0) {
                    const elements = parseTreeToElements(data);
                    cy.add(elements);

                    // Run hierarchical layout once on initial payload
                    cy.layout({
                        name: 'dagre',
                        nodeSep: 50,
                        rankSep: 70,
                        rankDir: 'TB' // Top-to-Bottom tree direction
                    }).run();

                    cy.fit();
                } else {
                    // Update statuses in batch mode without touching positions/edges
                    cy.batch(() => {
                        updateNodeStatuses(data);
                    });
                }
            });
        });
    </script>
</body>
</html>
